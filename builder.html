<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angus News Article Builder</title>
  <style>
    :root {
      --paper: #fbfaf7;
      --ink: #141414;
      --muted: #6f6b64;
      --line: #d8d1c7;
      --accent: #8d1f1f;
      --wash: #eee9df;
      --serif: Georgia, "Times New Roman", serif;
      --sans: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.5;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    header {
      border-bottom: 1px solid var(--ink);
    }

    .masthead {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 2px solid var(--ink);
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 700;
    }

    h1,
    h2,
    h3 {
      margin: 0;
      font-family: var(--serif);
      line-height: 1.12;
    }

    h1 {
      font-size: 32px;
    }

    .subhead {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 52px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 0.75fr);
      gap: 30px;
    }

    section {
      border-top: 1px solid var(--ink);
      padding-top: 18px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 16px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    label.full {
      grid-column: 1 / -1;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #fffefa;
      color: var(--ink);
      padding: 10px 11px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid rgba(141, 31, 31, 0.2);
      border-color: var(--accent);
    }

    .blocks {
      display: grid;
      gap: 14px;
      margin-top: 16px;
    }

    .block {
      border: 1px solid var(--line);
      background: rgba(255, 254, 250, 0.7);
      padding: 14px;
    }

    .block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .block-actions {
      display: flex;
      gap: 8px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--paper);
      padding: 10px 13px;
      cursor: pointer;
      font-weight: 700;
    }

    button.secondary {
      background: transparent;
      color: var(--ink);
    }

    button.danger {
      border-color: var(--accent);
      background: transparent;
      color: var(--accent);
    }

    button:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--paper);
    }

    aside {
      position: sticky;
      top: 20px;
      align-self: start;
    }

    .output-box {
      margin-top: 16px;
      display: grid;
      gap: 12px;
    }

    pre {
      min-height: 360px;
      max-height: 640px;
      overflow: auto;
      margin: 0;
      padding: 14px;
      border: 1px solid var(--line);
      background: #fffefa;
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.45;
    }

    .note {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .status {
      min-height: 20px;
      margin: 8px 0 0;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }

    @media (max-width: 860px) {
      .masthead,
      main {
        width: min(100% - 24px, 1120px);
      }

      .masthead {
        align-items: flex-start;
        flex-direction: column;
      }

      main,
      .field-grid {
        grid-template-columns: 1fr;
      }

      aside {
        position: static;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="masthead">
      <div class="brand">
        <div class="logo">AN</div>
        <div>
          <h1>Article Builder</h1>
          <p class="subhead">Fill this out, copy the result, paste it at the top of articles.js.</p>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div>
      <section>
        <h2>Story Details</h2>
        <div class="field-grid">
          <label>
            Category
            <select id="category">
              <option>Local</option>
              <option>Opinion</option>
              <option>World</option>
            </select>
          </label>

          <label>
            Date
            <input id="date" type="text" placeholder="June 22, 2026">
          </label>

          <label class="full">
            Headline
            <input id="headline" type="text" placeholder="Your headline">
          </label>

          <label class="full">
            Deck
            <textarea id="deck" placeholder="One short summary under the headline."></textarea>
          </label>

          <label>
            Byline
            <input id="byline" type="text" placeholder="By Your Name">
          </label>

          <label>
            Main Image
            <input id="mainImage" type="text" placeholder="images/main-photo.jpg">
          </label>
        </div>
      </section>

      <section style="margin-top: 28px;">
        <h2>Article Body</h2>
        <p class="note">Add blocks in the same order they should appear in the article.</p>

        <div class="button-row">
          <button type="button" id="addParagraph">Add Paragraph</button>
          <button type="button" id="addImage" class="secondary">Add Image / Chart</button>
        </div>

        <div class="blocks" id="blocks"></div>
      </section>
    </div>

    <aside>
      <section>
        <h2>Generated Code</h2>
        <p class="note">Copy this whole block and paste it right under <strong>window.ANGUS_NEWS_ARTICLES = [</strong></p>
        <div class="output-box">
          <pre id="output"></pre>
          <button type="button" id="copy">Copy Article Code</button>
          <p class="status" id="status"></p>
        </div>
      </section>
    </aside>
  </main>

  <script>
    const fields = {
      category: document.getElementById("category"),
      date: document.getElementById("date"),
      headline: document.getElementById("headline"),
      deck: document.getElementById("deck"),
      byline: document.getElementById("byline"),
      mainImage: document.getElementById("mainImage")
    };

    const blocks = document.getElementById("blocks");
    const output = document.getElementById("output");
    const status = document.getElementById("status");

    function slugify(value) {
      return String(value || "untitled-story")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "") || "untitled-story";
    }

    function quote(value) {
      return JSON.stringify(String(value || ""));
    }

    function todayLabel() {
      return new Date().toLocaleDateString("en-US", {
        month: "long",
        day: "numeric",
        year: "numeric"
      });
    }

    function createParagraphBlock(text = "") {
      const block = document.createElement("article");
      block.className = "block";
      block.dataset.type = "paragraph";
      block.innerHTML = `
        <div class="block-header">
          <span>Paragraph</span>
          <div class="block-actions">
            <button type="button" class="secondary" data-move="up">Up</button>
            <button type="button" class="secondary" data-move="down">Down</button>
            <button type="button" class="danger" data-remove>Remove</button>
          </div>
        </div>
        <label>
          Paragraph text
          <textarea data-field="text" placeholder="Write one paragraph here.">${text}</textarea>
        </label>
      `;
      return block;
    }

    function createImageBlock(src = "", caption = "") {
      const block = document.createElement("article");
      block.className = "block";
      block.dataset.type = "image";
      block.innerHTML = `
        <div class="block-header">
          <span>Image / Chart</span>
          <div class="block-actions">
            <button type="button" class="secondary" data-move="up">Up</button>
            <button type="button" class="secondary" data-move="down">Down</button>
            <button type="button" class="danger" data-remove>Remove</button>
          </div>
        </div>
        <div class="field-grid">
          <label>
            Image path
            <input data-field="src" type="text" placeholder="images/chart.jpg" value="${src}">
          </label>
          <label>
            Caption
            <input data-field="caption" type="text" placeholder="Caption under the image." value="${caption}">
          </label>
        </div>
      `;
      return block;
    }

    function bodyItemCode(block, isLast) {
      const comma = isLast ? "" : ",";

      if (block.dataset.type === "paragraph") {
        const text = block.querySelector("[data-field='text']").value.trim();
        return `    ${quote(text)}${comma}`;
      }

      const src = block.querySelector("[data-field='src']").value.trim();
      const caption = block.querySelector("[data-field='caption']").value.trim();

      return [
        "    {",
        "      type: \"image\",",
        `      src: ${quote(src)},`,
        `      caption: ${quote(caption)}`,
        `    }${comma}`
      ].join("\n");
    }

    function generate() {
      const headline = fields.headline.value.trim();
      const articleId = slugify(headline);
      const bodyBlocks = Array.from(blocks.children);

      const bodyCode = bodyBlocks.length
        ? bodyBlocks.map((block, index) => bodyItemCode(block, index === bodyBlocks.length - 1)).join("\n\n")
        : "    \"First paragraph goes here.\"";

      output.textContent = [
        "{",
        `  id: ${quote(articleId)},`,
        `  category: ${quote(fields.category.value)},`,
        `  headline: ${quote(headline || "Your Headline Here")},`,
        `  deck: ${quote(fields.deck.value.trim() || "One sentence summary under the headline.")},`,
        `  byline: ${quote(fields.byline.value.trim() || "By Your Name")},`,
        `  date: ${quote(fields.date.value.trim() || todayLabel())},`,
        `  image: ${quote(fields.mainImage.value.trim() || "images/main-photo.jpg")},`,
        "  body: [",
        bodyCode,
        "  ]",
        "},"
      ].join("\n");
    }

    function moveBlock(block, direction) {
      if (direction === "up" && block.previousElementSibling) {
        blocks.insertBefore(block, block.previousElementSibling);
      }

      if (direction === "down" && block.nextElementSibling) {
        blocks.insertBefore(block.nextElementSibling, block);
      }

      generate();
    }

    Object.values(fields).forEach((field) => {
      field.addEventListener("input", generate);
      field.addEventListener("change", generate);
    });

    blocks.addEventListener("input", generate);

    blocks.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      const block = event.target.closest(".block");
      if (!button || !block) return;

      if (button.dataset.remove !== undefined) {
        block.remove();
        generate();
      }

      if (button.dataset.move) {
        moveBlock(block, button.dataset.move);
      }
    });

    document.getElementById("addParagraph").addEventListener("click", () => {
      blocks.appendChild(createParagraphBlock());
      generate();
    });

    document.getElementById("addImage").addEventListener("click", () => {
      blocks.appendChild(createImageBlock());
      generate();
    });

    document.getElementById("copy").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(output.textContent);
        status.textContent = "Copied. Paste it at the top of articles.js.";
      } catch (error) {
        status.textContent = "Copy failed. Select the code manually and copy it.";
      }
    });

    fields.date.value = todayLabel();
    blocks.appendChild(createParagraphBlock());
    blocks.appendChild(createParagraphBlock());
    generate();
  </script>
</body>
</html>
